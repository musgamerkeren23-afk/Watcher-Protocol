<!DOCTYPE html>
<html>
<head>
<title>Watcher Protocol - MAP DETAIL</title>

<style>
body { margin:0; overflow:hidden; background:black; }
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// SCENE
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 10, 80);

const camera = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT GLOBAL
scene.add(new THREE.AmbientLight(0x222222));

// 🧱 ROOM CREATOR (DETAIL)
function createRoom(x,z,color,name){
  const g = new THREE.Group();

  // FLOOR
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(20,20),
    new THREE.MeshStandardMaterial({color})
  );
  floor.rotation.x = -Math.PI/2;
  g.add(floor);

  // WALL BACK
  const back = new THREE.Mesh(
    new THREE.BoxGeometry(20,10,0.5),
    new THREE.MeshStandardMaterial({color:0x333333})
  );
  back.position.set(0,5,-10);
  g.add(back);

  // SIDE WALLS
  const left = new THREE.Mesh(
    new THREE.BoxGeometry(0.5,10,20),
    new THREE.MeshStandardMaterial({color:0x222222})
  );
  left.position.set(-10,5,0);

  const right = left.clone();
  right.position.x = 10;

  g.add(left,right);

  // LIGHT
  const light = new THREE.PointLight(0xffffff,1.5,40);
  light.position.set(0,8,0);
  g.add(light);

  // DETAIL OBJECT (biar hidup)
  for(let i=0;i<5;i++){
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(2,2,2),
      new THREE.MeshStandardMaterial({color:0x555555})
    );
    box.position.set(
      Math.random()*10-5,
      1,
      Math.random()*10-5
    );
    g.add(box);
  }

  g.position.set(x,0,z);
  scene.add(g);
}

// 🗺️ MAP ROOMS
createRoom(0,0,0x111111,"office");
createRoom(0,-30,0x552222,"stage");
createRoom(-30,0,0x225522,"vent");
createRoom(30,0,0x222255,"hall2");
createRoom(0,30,0x444444,"hall1");

// 🎭 STAGE SPECIAL (lebih horror)
const stageLight = new THREE.PointLight(0xff0000,3,50);
stageLight.position.set(0,10,-30);
scene.add(stageLight);

// 👹 MONSTER (buat visual)
const monster = new THREE.Mesh(
  new THREE.BoxGeometry(2,3,1.5),
  new THREE.MeshStandardMaterial({color:0x111111})
);
monster.position.set(0,1.5,-35);
scene.add(monster);

// CAMERA CONTROL (TEST VIEW)
let mode = 0;

document.addEventListener("click",()=>{
  mode = (mode+1)%5;
});

// CAMERA UPDATE
function updateCam(){
  if(mode===0){
    camera.position.set(0,10,20); // office
    camera.lookAt(0,0,0);
  }
  if(mode===1){
    camera.position.set(0,10,-10); // stage
    camera.lookAt(0,0,-30);
  }
  if(mode===2){
    camera.position.set(-30,10,10); // vent
    camera.lookAt(-30,0,0);
  }
  if(mode===3){
    camera.position.set(30,10,10); // hall2
    camera.lookAt(30,0,0);
  }
  if(mode===4){
    camera.position.set(0,10,40); // hall1
    camera.lookAt(0,0,30);
  }
}

// LOOP
function animate(){
requestAnimationFrame(animate);

updateCam();
monster.rotation.y += 0.01;

renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
