<!DOCTYPE html>
<html>
<head>
<title>Watcher Protocol V7 FINAL</title>

<style>
body { margin:0; overflow:hidden; background:black; font-family:Arial; }

#ui {
  position:absolute;
  bottom:5px;
  width:100%;
  text-align:center;
}

button {
  padding:8px;
  margin:3px;
  background:#900;
  color:white;
  border:none;
}

#top { position:absolute; top:10px; left:10px; color:white; }
#power { position:absolute; top:10px; right:10px; color:red; }

#camUI {
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  display:none;
}
</style>
</head>

<body>

<div id="top">Night 1</div>
<div id="power">Power: 100%</div>

<div id="camUI">
  <button onclick="viewCam('hall')">HALL</button>
  <button onclick="viewCam('vent')">VENT</button>
  <button onclick="viewCam('stage')">STAGE</button>
</div>

<div id="ui">
  <button onclick="lookLeft()">LEFT</button>
  <button onclick="lookCenter()">CENTER</button>
  <button onclick="lookRight()">RIGHT</button>
  <br>
  <button onclick="toggleDoor('left')">LEFT DOOR</button>
  <button onclick="lightDoor('left')">LEFT LIGHT</button>
  <button onclick="toggleDoor('right')">RIGHT DOOR</button>
  <button onclick="lightDoor('right')">RIGHT LIGHT</button>
  <br>
  <button onclick="toggleCam()">📺 CAM</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// SCENE
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404040));

// ROOM FUNCTION (CLEAR VISUAL)
function room(x,z,color){
  const r = new THREE.Mesh(
    new THREE.BoxGeometry(10,5,10),
    new THREE.MeshStandardMaterial({
      color,
      roughness:0.8,
      metalness:0.2,
      side:THREE.BackSide
    })
  );
  r.position.set(x,2,z);
  scene.add(r);

  // BIG OBJECT (biar keliatan)
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(2,2,2),
    new THREE.MeshStandardMaterial({color:0xffffff})
  );
  box.position.set(x,1,z);
  scene.add(box);

  // LIGHT
  const light = new THREE.PointLight(0xffffff,1,15);
  light.position.set(x,3,z);
  scene.add(light);
}

// MAP
room(0,0,0x111111);     // office
room(10,0,0x2222ff);    // hall
room(-10,0,0x22ff22);   // vent
room(0,-20,0xff2222);   // stage

// CAMERA POS + TARGET
const camData = {
  office:{pos:[0,2,5], look:[0,1,0]},
  hall:{pos:[10,2,5], look:[10,1,0]},
  vent:{pos:[-10,2,5], look:[-10,1,0]},
  stage:{pos:[0,2,-10], look:[0,1,-20]}
};

// DOOR
function makeDoor(x){
  const d=new THREE.Mesh(
    new THREE.BoxGeometry(1,3,0.2),
    new THREE.MeshBasicMaterial({color:0x550000})
  );
  d.position.set(x,1.5,-4);
  scene.add(d);
  return d;
}
const leftDoor=makeDoor(-3);
const rightDoor=makeDoor(3);
let door={left:false,right:false};

// LIGHT DOOR
function makeLight(x){
  const l=new THREE.PointLight(0xffffaa,0,5);
  l.position.set(x,2,-3);
  scene.add(l);
  return l;
}
const leftLight=makeLight(-3);
const rightLight=makeLight(3);

// MONSTER (BIAR KELIATAN)
function monster(color){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,1.5,1.5),
    new THREE.MeshStandardMaterial({color})
  );
  scene.add(m);
  return m;
}

const watcher=monster(0xffffff);
watcher.position.set(0,0.75,-18);

// STATE
let cam="office";
let camOpen=false;

// CAMERA UPDATE
function updateCam(){
  let d=camData[cam];
  camera.position.set(...d.pos);
  camera.lookAt(...d.look);
}

// LOOK OFFICE
function lookLeft(){ if(camOpen)return; camera.rotation.y=0.8; }
function lookCenter(){ if(camOpen)return; camera.rotation.y=0; }
function lookRight(){ if(camOpen)return; camera.rotation.y=-0.8; }

// DOOR
function toggleDoor(s){
  door[s]=!door[s];
  let d=s=="left"?leftDoor:rightDoor;
  d.position.y=door[s]?0.5:1.5;
}

// LIGHT
function lightDoor(s){
  let l=s=="left"?leftLight:rightLight;
  l.intensity=2;
  setTimeout(()=>l.intensity=0,800);
}

// CAM
function toggleCam(){
  camOpen=!camOpen;
  camUI.style.display=camOpen?"block":"none";
  cam=camOpen?"hall":"office";
}
function viewCam(n){ cam=n; }

// LOOP
let tick=0;
function animate(){
requestAnimationFrame(animate);
tick++;

updateCam();

// MONSTER GERAK BIAR KELIATAN
if(tick%120===0){
  watcher.position.z += 2;
}

renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
