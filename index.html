<!DOCTYPE html>
<html>
<head>
<title>Watcher Protocol V11 FINAL</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background:black;

  /* 🔥 BLOCK SELECT */
  user-select:none;
  -webkit-user-select:none;
}

/* UI */
#ui {
  position:absolute;
  bottom:5px;
  width:100%;
  text-align:center;
}

button {
  padding:8px;
  margin:3px;
  background:#900;
  color:white;
  border:none;
}

/* 💀 JUMPSCARE */
#death {
  position:absolute;
  width:100%;
  height:100%;
  background:black;
  color:red;
  font-size:50px;
  display:none;
  justify-content:center;
  align-items:center;
}
</style>
</head>

<body>

<div id="death">💀 YOU DIED</div>

<div id="ui">
  <button onclick="lookLeft()">LEFT</button>
  <button onclick="lookCenter()">CENTER</button>
  <button onclick="lookRight()">RIGHT</button>
  <br>
  <button onclick="toggleDoor('left')">LEFT DOOR</button>
  <button onclick="lightDoor('left')">LEFT LIGHT</button>
  <button onclick="toggleDoor('right')">RIGHT DOOR</button>
  <button onclick="lightDoor('right')">RIGHT LIGHT</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// BLOCK RIGHT CLICK
document.addEventListener("contextmenu", e=>e.preventDefault());

// ===== BASIC =====
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 10, 100);

const camera = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.1, 2000);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.toneMappingExposure = 1.5;
document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff,0.7));

// ===== ROOM =====
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({color:0x111111})
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

const wall = new THREE.Mesh(
  new THREE.BoxGeometry(20,10,0.5),
  new THREE.MeshStandardMaterial({color:0x333333})
);
wall.position.set(0,5,-10);
scene.add(wall);

// ===== DOOR =====
function makeDoor(x){
  const d = new THREE.Mesh(
    new THREE.BoxGeometry(1,5,0.5),
    new THREE.MeshStandardMaterial({color:0x550000})
  );
  d.position.set(x,2.5,-5);
  scene.add(d);
  return d;
}

const leftDoor = makeDoor(-4);
const rightDoor = makeDoor(4);

let door = {left:false,right:false};

function toggleDoor(side){
  door[side] = !door[side];
  let d = side==="left"?leftDoor:rightDoor;
  d.position.y = door[side]?1:2.5;
}

// ===== LIGHT =====
function lightDoor(side){
  const flash = new THREE.PointLight(0xffffaa,6,15);
  let x = side==="left"?-4:4;
  flash.position.set(x,3,-3);
  scene.add(flash);

  setTimeout(()=>scene.remove(flash),500);
}

// ===== CAMERA =====
camera.position.set(0,5,15);

function lookLeft(){ camera.rotation.y=0.8; }
function lookCenter(){ camera.rotation.y=0; }
function lookRight(){ camera.rotation.y=-0.8; }

// ===== ANIMATRONIC =====
const monster = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.BoxGeometry(2,3,1.5),
  new THREE.MeshStandardMaterial({color:0x222222})
);

const head = new THREE.Mesh(
  new THREE.BoxGeometry(1.5,1.5,1.5),
  new THREE.MeshStandardMaterial({color:0x333333})
);
head.position.y = 2.2;

const eye = new THREE.Mesh(
  new THREE.SphereGeometry(0.2),
  new THREE.MeshBasicMaterial({color:0xffffff})
);
eye.position.set(0.4,2.2,0.8);

const eye2 = eye.clone();
eye2.position.x = -0.4;

monster.add(body,head,eye,eye2);
scene.add(monster);

monster.position.set(0,0,-20);

// ===== JUMPSCARE =====
function jumpscare(){
  document.getElementById("death").style.display="flex";
  setTimeout(()=>location.reload(),2000);
}

// ===== AI =====
let tick=0;

function updateAI(){

  // maju pelan
  if(monster.position.z < -5){
    monster.position.z += 0.05;
  }

  // pilih sisi
  if(monster.position.z < -10){
    monster.position.x = Math.random()>0.5 ? -4 : 4;
  }

  // stop di pintu
  if(monster.position.z >= -5){
    monster.position.z = -5;
  }

  let side = monster.position.x < 0 ? "left" : "right";

  if(monster.position.z >= -5){

    if(!door[side]){
      jumpscare();
    } else {
      monster.position.z = -20; // mundur
    }
  }

  // animasi
  monster.rotation.y += 0.01;
}

// ===== LOOP =====
function animate(){
requestAnimationFrame(animate);

tick++;
updateAI();

renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
