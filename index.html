<!DOCTYPE html>
<html>
<head>
<title>Watcher Protocol V5 FINAL</title>

<style>
body { margin:0; overflow:hidden; background:black; font-family:Arial; }

#ui {
  position:absolute;
  bottom:5px;
  width:100%;
  text-align:center;
}

button {
  padding:8px;
  margin:3px;
  background:#900;
  color:white;
  border:none;
  font-size:12px;
}

#top {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
}

#power {
  position:absolute;
  top:10px;
  right:10px;
  color:red;
}

#camUI {
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  display:none;
}

#jumpscare {
  position:absolute;
  width:100%;
  height:100%;
  background:black;
  color:red;
  font-size:40px;
  display:none;
  justify-content:center;
  align-items:center;
}
</style>
</head>

<body>

<div id="top">Night 1</div>
<div id="power">Power: 100%</div>

<div id="jumpscare">💀</div>

<div id="camUI">
  <button onclick="viewCam('hall')">HALL</button>
  <button onclick="viewCam('vent')">VENT</button>
  <button onclick="viewCam('stage')">STAGE</button>
</div>

<div id="ui">
  <button onclick="lookLeft()">LEFT</button>
  <button onclick="lookCenter()">CENTER</button>
  <button onclick="lookRight()">RIGHT</button>
  <br>
  <button onclick="toggleDoor('left')">LEFT DOOR</button>
  <button onclick="lightDoor('left')">LEFT LIGHT</button>
  <button onclick="toggleDoor('right')">RIGHT DOOR</button>
  <button onclick="lightDoor('right')">RIGHT LIGHT</button>
  <br>
  <button onclick="toggleCam()">📺 CAM</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// SCENE
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404040));

// MAP
const camPos = {
  office:[0,2,3],
  hall:[10,2,3],
  vent:[-10,2,3],
  stage:[0,2,-15]
};

// ROOM
function room(x,z){
  const r=new THREE.Mesh(
    new THREE.BoxGeometry(8,5,8),
    new THREE.MeshBasicMaterial({color:0x111111,side:THREE.BackSide})
  );
  r.position.set(x,2,z);
  scene.add(r);
}
room(0,0); room(10,0); room(-10,0); room(0,-20);

// DOOR
function makeDoor(x){
  const d=new THREE.Mesh(
    new THREE.BoxGeometry(1,3,0.2),
    new THREE.MeshBasicMaterial({color:0x550000})
  );
  d.position.set(x,1.5,-4);
  scene.add(d);
  return d;
}
const leftDoor=makeDoor(-3);
const rightDoor=makeDoor(3);

let door={left:false,right:false};

// LIGHT
function makeLight(x){
  const l=new THREE.PointLight(0xffffaa,0,5);
  l.position.set(x,2,-3);
  scene.add(l);
  return l;
}
const leftLight=makeLight(-3);
const rightLight=makeLight(3);

// MONSTER
function monster(color){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshBasicMaterial({color})
  );
  scene.add(m);
  return m;
}
const watcher=monster(0xffffff);
const crawler=monster(0xff0000);

// SPAWN
function resetM(m){ m.position.set(0,0.5,-18); }
resetM(watcher); resetM(crawler);

// STATE
let camOpen=false;
let cam="office";
let power=100;
let safe=600;
let tick=0;

// CAMERA
function updateCam(){
  let p=camPos[cam];
  camera.position.set(p[0],p[1],p[2]);
}

// LOOK
function lookLeft(){ if(camOpen)return; camera.rotation.y=0.8; }
function lookCenter(){ if(camOpen)return; camera.rotation.y=0; }
function lookRight(){ if(camOpen)return; camera.rotation.y=-0.8; }

// DOOR
function toggleDoor(s){
  door[s]=!door[s];
  let d=s=="left"?leftDoor:rightDoor;
  d.position.y=door[s]?0.5:1.5;
}

// LIGHT
function lightDoor(s){
  let l=s=="left"?leftLight:rightLight;
  l.intensity=2;
  setTimeout(()=>l.intensity=0,800);
}

// CAM
function toggleCam(){
  camOpen=!camOpen;
  camUI.style.display=camOpen?"block":"none";
  cam=camOpen?"hall":"office";
}
function viewCam(n){ cam=n; }

// JUMPSCARE
function jumpscare(){
  jumpscareDiv.style.display="flex";
  setTimeout(()=>location.reload(),2000);
}

// LOOP
function animate(){
requestAnimationFrame(animate);
tick++;

updateCam();

// SAFE
if(safe>0){ safe--; }

// POWER
power -= door.left||door.right ? 0.02:0.01;
power -= camOpen ? 0.02:0;

if(power<=0) jumpscare();

// WATCHER (pelan)
if(safe<=0 && tick%120===0){
  watcher.position.z+=2;
}

// CRAWLER (cepat)
if(safe<=0 && tick%80===0){
  crawler.position.z+=3;
}

// CHECK
[watcher,crawler].forEach(m=>{
  if(m.position.z>-2){
    if(!door.left && !door.right){
      jumpscare();
    } else {
      resetM(m);
    }
  }
});

// UI
top.innerText = safe>0 ? "GET READY..." : "Night 1";
powerText.innerText="Power: "+Math.floor(power)+"%";

renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
