<!DOCTYPE html>
<html>
<head>
<title>Watcher Protocol V8</title>

<style>
body { margin:0; overflow:hidden; background:black; }

#ui {
  position:absolute;
  bottom:5px;
  width:100%;
  text-align:center;
}

button {
  padding:8px;
  margin:3px;
  background:#900;
  color:white;
  border:none;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="lookLeft()">LEFT</button>
  <button onclick="lookCenter()">CENTER</button>
  <button onclick="lookRight()">RIGHT</button>
  <br>
  <button onclick="toggleDoor('left')">LEFT DOOR</button>
  <button onclick="lightDoor('left')">LEFT LIGHT</button>
  <button onclick="toggleDoor('right')">RIGHT DOOR</button>
  <button onclick="lightDoor('right')">RIGHT LIGHT</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// BASIC
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000,5,25);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0x222222));

// ROOM
const room = new THREE.Mesh(
  new THREE.BoxGeometry(10,5,10),
  new THREE.MeshStandardMaterial({color:0x111111, side:THREE.BackSide})
);
scene.add(room);

// DOOR
function makeDoor(x){
  const d = new THREE.Mesh(
    new THREE.BoxGeometry(1,3,0.2),
    new THREE.MeshStandardMaterial({color:0x550000})
  );
  d.position.set(x,1.5,-4);
  scene.add(d);
  return d;
}
const leftDoor = makeDoor(-3);
const rightDoor = makeDoor(3);

let door = {left:false,right:false};

// 💡 FIXED SPOTLIGHT
function makeSpot(x){
  const s = new THREE.SpotLight(0xffffaa,0,10,Math.PI/6,0.5);
  s.position.set(x,2,2);
  s.target.position.set(x,1,-4);
  scene.add(s.target);
  scene.add(s);
  return s;
}

const leftLight = makeSpot(-3);
const rightLight = makeSpot(3);

// 👹 CUSTOM ANIMATRONIC (beda dari FNAF)
function createAnimatronic(){
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.2,1.5,0.8),
    new THREE.MeshStandardMaterial({color:0x222222})
  );

  const head = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({color:0x333333})
  );
  head.position.y = 1.2;

  const eyeL = new THREE.Mesh(
    new THREE.SphereGeometry(0.1),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  eyeL.position.set(-0.2,1.2,0.5);

  const eyeR = eyeL.clone();
  eyeR.position.x = 0.2;

  group.add(body,head,eyeL,eyeR);
  scene.add(group);

  return group;
}

const anim = createAnimatronic();
anim.position.set(-3,0,-6); // kiri pintu

// CAMERA
camera.position.set(0,2,3);

// LOOK
let camOpen=false;

function lookLeft(){ if(camOpen)return; camera.rotation.y=0.8; }
function lookCenter(){ if(camOpen)return; camera.rotation.y=0; }
function lookRight(){ if(camOpen)return; camera.rotation.y=-0.8; }

// DOOR
function toggleDoor(side){
  door[side] = !door[side];
  let d = side=="left"?leftDoor:rightDoor;
  d.position.y = door[side]?0.5:1.5;
}

// 💡 LIGHT SYSTEM FIX
function lightDoor(side){
  let light = side=="left"?leftLight:rightLight;

  light.intensity = 3;

  // REVEAL MONSTER
  if(side=="left" && anim.position.x < 0){
    anim.visible = true;
  }

  setTimeout(()=>{
    light.intensity = 0;
    anim.visible = false;
  },1000);
}

// LOOP
function animate(){
requestAnimationFrame(animate);

// idle animation (biar hidup)
anim.rotation.y += 0.01;

renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
